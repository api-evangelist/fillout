description: >-
  FOCUS-aligned FinOps profile for Fillout. Billing is a flat monthly tier fee
  (Free / Starter / Pro / Business / Enterprise) with monthly response caps as
  the primary scaling driver. Annual billing offers material discounts.
  Unlimited seats and unlimited forms across tiers, so per-form-per-team
  allocation is straightforward.
notes: >-
  Optimisation levers are right-sizing tier and stepping up for the lowest
  feature set required (custom domain, branding removal, analytics) — not
  meter-based.

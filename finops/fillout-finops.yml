meters:
- name: plan_subscription
  description: Flat monthly Fillout plan fee.
  unit: month
  aggregation: sum
  dimensions:
  - account
  - plan
- name: monthly_responses
  description: Form responses counted against the plan's monthly cap.
  unit: response
  aggregation: sum
  dimensions:
  - account
  - form
- name: forms
  description: Active forms (informational).
  unit: form
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Use Fillout admin response counter; export submissions for finance allocation if needed.
- name: Allocation
  description: Use account or workspace structure to allocate forms by team.
- name: Optimization
  description: Right-size tier annually; switch to annual billing for ~25% effective discount; consolidate low-traffic forms.
- name: Accountability
  description: Assign account owner; alert on response burn-down.

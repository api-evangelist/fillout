specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Fillout
providerId: fillout
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: true
tags:
- Forms
- Surveys
- No-Code
- Airtable
- Notion
- Rate Limiting
- Quotas
- Throttling
description: >-
  Fillout REST API endpoints are limited to no more than 30 requests per
  second per account / API key. Above the limit, requests are rejected with
  HTTP 429. Plan-level monthly response caps act as a secondary, business-
  level throttle.
notes: >-
  Public docs explicitly state the 30 req/s cap. Self-hosted Fillout and the
  EU agent share the same limit.
sources:
- https://www.fillout.com/help/fillout-rest-api
responseCodes:
  throttled: 429
headers:
- name: Retry-After
  description: Seconds to wait before retrying after a 429.
limits:
- name: REST API per account/API key
  scope: account
  metric: requests
  limit: 30
  timeFrame: 1s
- name: Free plan responses
  scope: account
  metric: responses/month
  limit: 1000
- name: Starter plan responses
  scope: account
  metric: responses/month
  limit: 2000
- name: Pro plan responses
  scope: account
  metric: responses/month
  limit: 5000
- name: Business plan responses
  scope: account
  metric: responses/month
  limit: -1
  notes: Unlimited.
policies:
- name: Backoff Strategy
  description: Honor Retry-After on 429; use exponential backoff with jitter.
- name: Region selection
  description: EU agent and self-hosted return their own base URL via the dashboard.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
